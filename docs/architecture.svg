<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><rect width="1000" height="660" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#243149}.head{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px;fill:#687991}</style><text x="55" y="65" class="head">ResourceShare / system architecture</text><text x="55" y="95" class="note">Server-enforced permissions and atomic shared availability</text><g fill="none" stroke="#2458ec" stroke-width="2"><path d="M500 220V290"/><path d="M500 365V455"/><path d="M270 490L405 365"/><path d="M600 365L780 455"/></g><g stroke="#dce4f0" fill="#eef3ff"><rect x="325" y="145" width="350" height="75" rx="14"/><rect x="325" y="290" width="350" height="75" rx="14"/></g><g stroke="#dde7d1" fill="#f0f6e8"><rect x="65" y="455" width="250" height="95" rx="14"/><rect x="375" y="455" width="250" height="95" rx="14"/><rect x="685" y="455" width="250" height="95" rx="14"/></g><g text-anchor="middle"><text x="500" y="180" class="label">React workspace</text><text x="500" y="203" class="note">Student / owner / administrator</text><text x="500" y="322" class="label">Workspace API + domain rules</text><text x="500" y="347" class="note">Identity, roles, eligibility, FIFO, lifecycle</text><text x="190" y="493" class="label">Platform identity</text><text x="190" y="519" class="note">Trusted hosting headers</text><text x="500" y="493" class="label">D1 state + revision</text><text x="500" y="519" class="note">Atomic compare-and-swap</text><text x="810" y="493" class="label">Audit + notifications</text><text x="810" y="519" class="note">In the same atomic state</text></g><text x="55" y="615" class="note">Original browser-local prototype retained at /legacy. Google OAuth and email delivery are not configured.</text></svg>